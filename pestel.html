<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PESTEL战略分析工具V1.1 — 实时多维度评估与可视化</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --P-bg:#eff6ff;--P-text:#1e40af;--P-bar:#3b82f6;
  --E-bg:#f0fdf4;--E-text:#166534;--E-bar:#22c55e;
  --S-bg:#faf5ff;--S-text:#7c3aed;--S-bar:#a855f7;
  --T-bg:#fff7ed;--T-text:#c2410c;--T-bar:#f97316;
  --En-bg:#f0fdfa;--En-text:#0f766e;--En-bar:#14b8a6;
  --L-bg:#fef2f2;--L-text:#991b1b;--L-bar:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:24px}

/* Header */
.page-header{padding-bottom:16px;border-bottom:2px solid var(--P-bar);margin-bottom:20px}
.page-header h1{font-size:1.7rem;font-weight:700;color:var(--text);letter-spacing:-.3px}
.page-header .sub{font-size:1rem;color:var(--muted);margin-top:4px;font-weight:400}

/* Section title */
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:1.15rem;font-weight:700;color:var(--text)}
.section-title::before{content:'';width:4px;height:22px;background:var(--P-bar);border-radius:2px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;padding:14px 16px;background:var(--card);border-radius:10px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.toolbar label{font-size:.82rem;color:var(--muted);font-weight:500}
.toolbar select,.toolbar input,.toolbar button{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:.85rem;outline:none;transition:.15s}
.toolbar select:focus,.toolbar input:focus{border-color:var(--P-bar);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.toolbar button{cursor:pointer;font-weight:500;background:var(--P-bar);color:#fff;border-color:var(--P-bar)}
.toolbar button:hover{background:#2563eb}
.toolbar button.secondary{background:#fff;color:var(--muted);border-color:var(--border)}
.toolbar button.secondary:hover{border-color:var(--muted);color:var(--text)}
.toolbar input[type=file]{display:none}

/* Layout */
.main-grid{display:grid;grid-template-columns:1fr 380px;gap:24px}
@media(max-width:1100px){.main-grid{grid-template-columns:1fr}}

/* Cards grid */
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.cards-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.cards-grid{grid-template-columns:1fr}}

/* Dimension card */
.dim-card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:box-shadow .2s}
.dim-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.dim-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.dim-header .left{display:flex;align-items:center;gap:10px}
.dim-header .badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#fff}
.dim-header .name{font-size:.95rem;font-weight:700}
.dim-header .avg{font-size:1.15rem;font-weight:700}
.dim-body{padding:12px 16px 14px}

/* Factor row */
.factor{padding:8px 0;border-bottom:1px dashed #e2e8f0}
.factor:last-child{border-bottom:none;padding-bottom:0}
.factor-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.factor-name{font-size:.85rem;font-weight:600}
.factor-name small{display:block;font-size:.72rem;color:var(--muted);font-weight:400;margin-top:1px}
.factor-controls{display:flex;align-items:center;gap:8px}
.factor input[type=range]{width:100%;cursor:pointer;height:4px;border-radius:2px;-webkit-appearance:none;appearance:none;background:#e2e8f0;outline:none}
.factor input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.factor .num{width:36px;text-align:center;font-weight:700;font-size:.85rem;background:#f8fafc;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:3px 2px}
.factor .note-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:#f8fafc;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:.15s}
.factor .note-btn:hover{border-color:var(--muted);color:var(--text)}
.factor .note-btn.on{background:#eff6ff;border-color:var(--P-bar);color:var(--P-bar)}
.note-box{width:100%;margin-top:6px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#f8fafc;font-size:.8rem;color:var(--text);resize:vertical;min-height:50px;outline:none;display:none}
.note-box.open{display:block}
.note-box:focus{border-color:var(--P-bar)}

/* Color variants */
.dim-P .dim-header{background:var(--P-bg)}
.dim-P .badge{background:var(--P-bar)}
.dim-P .name{color:var(--P-text)}
.dim-P .avg{color:var(--P-text)}
.dim-P input[type=range]::-webkit-slider-thumb{background:var(--P-bar)}
.dim-E .dim-header{background:var(--E-bg)}
.dim-E .badge{background:var(--E-bar)}
.dim-E .name{color:var(--E-text)}
.dim-E .avg{color:var(--E-text)}
.dim-E input[type=range]::-webkit-slider-thumb{background:var(--E-bar)}
.dim-S .dim-header{background:var(--S-bg)}
.dim-S .badge{background:var(--S-bar)}
.dim-S .name{color:var(--S-text)}
.dim-S .avg{color:var(--S-text)}
.dim-S input[type=range]::-webkit-slider-thumb{background:var(--S-bar)}
.dim-T .dim-header{background:var(--T-bg)}
.dim-T .badge{background:var(--T-bar)}
.dim-T .name{color:var(--T-text)}
.dim-T .avg{color:var(--T-text)}
.dim-T input[type=range]::-webkit-slider-thumb{background:var(--T-bar)}
.dim-En .dim-header{background:var(--En-bg)}
.dim-En .badge{background:var(--En-bar)}
.dim-En .name{color:var(--En-text)}
.dim-En .avg{color:var(--En-text)}
.dim-En input[type=range]::-webkit-slider-thumb{background:var(--En-bar)}
.dim-L .dim-header{background:var(--L-bg)}
.dim-L .badge{background:var(--L-bar)}
.dim-L .name{color:var(--L-text)}
.dim-L .avg{color:var(--L-text)}
.dim-L input[type=range]::-webkit-slider-thumb{background:var(--L-bar)}

/* Sidebar */
.sidebar{display:flex;flex-direction:column;gap:16px}
.widget{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.widget h4{font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.chart-wrap{position:relative;height:260px}
.summary-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:.88rem}
.summary-item:last-child{border-bottom:none}
.summary-item .label{font-weight:500}
.summary-item .val{font-weight:700}
.summary-total{margin-top:10px;padding-top:10px;border-top:2px solid var(--border);display:flex;justify-content:space-between;font-size:1rem;font-weight:700}

/* Actions */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:100px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:#f8fafc;color:var(--text);font-size:.82rem;cursor:pointer;transition:.15s;font-weight:500}
.actions button:hover{background:var(--P-bar);border-color:var(--P-bar);color:#fff}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--card);border-radius:14px;border:1px solid var(--border);max-width:620px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:1rem;font-weight:700}
.modal-header .close{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#f8fafc;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.modal-header .close:hover{color:var(--text)}
.modal-body{padding:14px 20px;overflow-y:auto;flex:1}
.modal-body textarea{width:100%;min-height:220px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:.8rem;resize:vertical;outline:none}
.modal-body textarea:focus{border-color:var(--P-bar)}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.modal-footer button{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:#f8fafc;color:var(--text);font-size:.82rem;cursor:pointer;font-weight:500}
.modal-footer button.primary{background:var(--P-bar);border-color:var(--P-bar);color:#fff}

/* Score color classes */
.score-low{color:#dc2626}
.score-mid{color:#ea580c}
.score-high{color:#16a34a}

footer{text-align:center;padding:28px 0 12px;color:var(--muted);font-size:.75rem}
</style>
</head>
<body>
<div class="container">

<header class="page-header">
  <h1>PESTEL战略分析工具</h1>
  <div class="sub">——实时多维度评估与可视化</div>
</header>

<div class="toolbar">
  <label>行业模板</label>
  <select id="industrySelect">
    <option value="custom">自定义</option>
    <option value="logistics">跨境物流</option>
    <option value="tech">科技 / SaaS</option>
    <option value="retail">新零售 / 电商</option>
    <option value="finance">金融科技</option>
    <option value="manufacturing">高端制造</option>
    <option value="energy">新能源</option>
    <option value="healthcare">医疗健康</option>
    <option value="realestate">房地产</option>
  </select>
  <input id="projectName" placeholder="项目名称（可选）" style="min-width:170px">
  <button onclick="exportJSON()">导出 JSON</button>
  <button onclick="exportCSV()">导出 CSV</button>
  <button class="secondary" onclick="document.getElementById('fileInput').click()">导入 JSON</button>
  <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
  <button class="secondary" onclick="openReport()">生成报告</button>
</div>

<div class="section-title">PESTEL全要素分析框架</div>

<div class="main-grid">
  <div class="left" id="cardsArea"></div>
  <div class="sidebar">
    <div class="widget">
      <h4>雷达图</h4>
      <div class="chart-wrap"><canvas id="radarChart"></canvas></div>
    </div>
    <div class="widget">
      <h4>维度对比</h4>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    </div>
    <div class="widget">
      <h4>评估摘要</h4>
      <div id="summaryBox"></div>
    </div>
    <div class="widget">
      <h4>操作</h4>
      <div class="actions">
        <button onclick="exportJSON()">导出 JSON</button>
        <button onclick="exportCSV()">导出 CSV</button>
        <button class="secondary" onclick="document.getElementById('fileInput').click()">导入 JSON</button>
        <button class="secondary" onclick="openReport()">生成报告</button>
      </div>
    </div>
  </div>
</div>

<footer>PESTEL Analyzer V1.1 | 数据仅存储于本地浏览器 | 参考 A3-2 独立版风格重构</footer>
</div>

<div class="modal" id="reportModal">
  <div class="modal-box">
    <div class="modal-header"><h3>PESTEL 分析报告</h3><button class="close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body"><textarea id="reportText" readonly></textarea></div>
    <div class="modal-footer">
      <button onclick="copyReport()">复制报告</button>
      <button class="primary" onclick="downloadReport()">下载 TXT</button>
    </div>
  </div>
</div>

<script>
const DIMENSIONS=[
{key:'P',name:'P — 政治 (Political)',icon:'P',color:'#3b82f6',factors:[
{n:'政策法规',d:'行业监管、税收优惠、贸易政策'},
{n:'政府稳定性',d:'政治局势、政策连续性'},
{n:'国际关系',d:'地缘政治、双边协议、制裁风险'},
{n:'国有化风险',d:'资产征收、外资限制'},
{n:'腐败指数',d:'透明国际排名、营商环境'}
]},
{key:'E',name:'E — 经济 (Economic)',icon:'E',color:'#22c55e',factors:[
{n:'GDP增长',d:'宏观经济增速'},
{n:'汇率波动',d:'本币对美元/欧元稳定性'},
{n:'通货膨胀',d:'CPI/PPI、购买力变化'},
{n:'利率环境',d:'融资成本、基准利率'},
{n:'居民收入',d:'可支配收入、消费升级'}
]},
{key:'S',name:'S — 社会 (Social)',icon:'S',color:'#a855f7',factors:[
{n:'人口结构',d:'老龄化、劳动力供给'},
{n:'消费习惯',d:'线上渗透率、品牌偏好'},
{n:'教育水平',d:'高等教育普及率'},
{n:'文化价值观',d:'本地化需求、ESG意识'},
{n:'城市化率',d:'城镇化、人口流动'}
]},
{key:'T',name:'T — 技术 (Technological)',icon:'T',color:'#f97316',factors:[
{n:'技术迭代速度',d:'颠覆性技术出现频率'},
{n:'数字化水平',d:'AI/大数据/云计算普及'},
{n:'研发投入',d:'R&D强度、专利密度'},
{n:'基础设施',d:'5G/数据中心/物联网'},
{n:'技术人才',d:'工程师供给'}
]},
{key:'En',name:'En — 环境 (Environmental)',icon:'En',color:'#14b8a6',factors:[
{n:'环保法规',d:'碳排放限制、排放标准'},
{n:'气候风险',d:'极端天气、自然灾害'},
{n:'资源约束',d:'能源/水资源可得性'},
{n:'碳中和目标',d:'双碳政策、绿色金融'},
{n:'循环经济',d:'废弃物回收、绿色供应链'}
]},
{key:'L',name:'L — 法律 (Legal)',icon:'L',color:'#ef4444',factors:[
{n:'劳动法规',d:'最低工资、社保、解雇保护'},
{n:'知识产权保护',d:'专利/商标/版权执法'},
{n:'数据隐私',d:'GDPR/个人信息保护法'},
{n:'反垄断',d:'平台监管、并购审查'},
{n:'争议解决',d:'司法效率、仲裁便利性'}
]}
];

const PRESETS={
logistics:{P:[7,6,8,5,6],E:[7,5,6,6,7],S:[6,8,5,6,7],T:[7,8,6,7,5],En:[5,6,4,5,6],L:[6,5,6,7,5]},
tech:{P:[6,7,7,4,7],E:[8,6,7,8,8],S:[7,9,8,7,8],T:[9,9,9,8,8],En:[6,5,5,6,6],L:[6,8,7,6,7]},
retail:{P:[6,7,6,5,6],E:[6,5,5,6,6],S:[7,9,6,7,8],T:[8,9,6,7,6],En:[5,5,4,5,6],L:[6,6,6,6,6]},
finance:{P:[5,6,6,4,5],E:[7,5,6,6,7],S:[6,7,7,6,7],T:[8,8,7,7,7],En:[5,5,4,5,5],L:[6,7,7,7,6]},
manufacturing:{P:[6,7,7,5,5],E:[7,5,6,6,6],S:[5,6,6,5,6],T:[7,7,8,6,6],En:[6,6,5,6,6],L:[6,6,6,6,6]},
energy:{P:[7,7,6,6,5],E:[7,5,7,6,6],S:[5,5,5,5,6],T:[8,7,9,7,6],En:[8,7,6,8,7],L:[6,6,6,6,6]},
healthcare:{P:[6,7,6,4,5],E:[6,5,5,5,6],S:[8,7,8,7,7],T:[8,8,8,7,7],En:[5,5,4,5,5],L:[7,8,8,6,6]},
realestate:{P:[5,6,5,4,4],E:[4,4,3,4,5],S:[6,6,5,5,7],T:[6,6,5,5,5],En:[5,6,4,5,5],L:[5,5,5,5,5]}
};

let data={};
let radarChart,barChart;

function initData(){
data={};
DIMENSIONS.forEach(d=>{data[d.key]=d.factors.map(()=>({v:5,n:''}));});
}

function render(){
const container=document.getElementById('cardsArea');
container.innerHTML='';
const grid=document.createElement('div');grid.className='cards-grid';
DIMENSIONS.forEach(d=>{
const dimData=data[d.key];
const avg=(dimData.reduce((s,x)=>s+x.v,0)/dimData.length).toFixed(1);
const card=document.createElement('div');
card.className=`dim-card dim-${d.key}`;
let factorsHtml='';
d.factors.forEach((f,i)=>{
factorsHtml+=`<div class="factor">
  <div class="factor-top">
    <div class="factor-name">${f.n}<small>${f.d}</small></div>
    <div class="factor-controls">
      <input class="num" type="number" min="1" max="10" value="${dimData[i].v}" onchange="setVal('${d.key}',${i},this.value)">
      <button class="note-btn ${dimData[i].n?'on':''}" onclick="toggleNote('${d.key}',${i})" title="备注">&#9998;</button>
    </div>
  </div>
  <input type="range" min="1" max="10" step="1" value="${dimData[i].v}" oninput="setVal('${d.key}',${i},this.value)">
  <textarea class="note-box" id="note-${d.key}-${i}" placeholder="输入备注..." oninput="updateNote('${d.key}',${i},this.value)">${dimData[i].n}</textarea>
</div>`;
});
card.innerHTML=`<div class="dim-header"><div class="left"><div class="badge">${d.icon}</div><div class="name">${d.name}</div></div><div class="avg ${avg<4?'score-low':avg<7?'score-mid':'score-high'}">${avg}</div></div><div class="dim-body">${factorsHtml}</div>`;
grid.appendChild(card);
});
container.appendChild(grid);
updateCharts();updateSummary();
}

function setVal(dk,idx,val){val=Math.max(1,Math.min(10,parseInt(val)||5));data[dk][idx].v=val;render();}
function toggleNote(k,i){document.getElementById(`note-${k}-${i}`).classList.toggle('open');}
function updateNote(k,i,val){data[k][i].n=val;const btn=document.querySelector(`#note-${k}-${i}`).previousElementSibling.querySelector('.note-btn')||document.querySelector(`textarea[id="note-${k}-${i}"]`).parentElement.querySelector('.note-btn');if(btn)btn.classList.toggle('on',val.length>0);}

function updateCharts(){
const labels=DIMENSIONS.map(d=>d.icon);
const values=DIMENSIONS.map(d=>{
const arr=data[d.key];
return +(arr.reduce((s,x)=>s+x.v,0)/arr.length).toFixed(1);
});
const colors=DIMENSIONS.map(d=>d.color);

if(!radarChart){
radarChart=new Chart(document.getElementById('radarChart'),{
type:'radar',data:{labels,datasets:[{label:'综合评分',data:values,backgroundColor:'rgba(59,130,246,0.15)',borderColor:'#3b82f6',pointBackgroundColor:colors,pointBorderColor:'#fff',pointRadius:5,borderWidth:2}]},
options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:0,max:10,ticks:{stepSize:2,color:'#94a3b8',backdropColor:'transparent'},grid:{color:'#e2e8f0'},pointLabels:{color:'#475569',font:{size:11,weight:'600'}}}},plugins:{legend:{display:false}}}
});
}else{radarChart.data.datasets[0].data=values;radarChart.update();}

if(!barChart){
barChart=new Chart(document.getElementById('barChart'),{
type:'bar',data:{labels,datasets:[{label:'平均分',data:values,backgroundColor:colors,borderRadius:6,borderSkipped:false}]},
options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:10,grid:{color:'#e2e8f0'},ticks:{color:'#64748b',font:{size:10}}},x:{grid:{display:false},ticks:{color:'#475569',font:{size:11,weight:'600'}}}},plugins:{legend:{display:false}}}
});
}else{barChart.data.datasets[0].data=values;barChart.update();}
}

function updateSummary(){
const items=DIMENSIONS.map(d=>{
const arr=data[d.key];
const avg=+(arr.reduce((s,x)=>s+x.v,0)/arr.length).toFixed(1);
return {name:d.name.split(' ')[0],avg,color:d.color};
});
const total=+(items.reduce((s,x)=>s+x.avg,0)/items.length).toFixed(1);
let html=items.map(it=>`<div class="summary-item"><span class="label" style="color:${it.color}">${it.name}</span><span class="val ${it.avg<4?'score-low':it.avg<7?'score-mid':'score-high'}">${it.avg}</span></div>`).join('');
html+=`<div class="summary-total"><span>综合评分</span><span class="${total<4?'score-low':total<7?'score-mid':'score-high'}">${total}</span></div>`;
document.getElementById('summaryBox').innerHTML=html;
}

function exportJSON(){
const payload={meta:{name:document.getElementById('projectName').value||'PESTEL分析',date:new Date().toLocaleString('zh-CN'),industry:document.getElementById('industrySelect').value},data};
const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download=`pestel_${Date.now()}.json`;a.click();URL.revokeObjectURL(url);
}

function importJSON(e){
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=function(ev){try{const o=JSON.parse(ev.target.result);if(o.data){data=o.data;render();document.getElementById('projectName').value=o.meta?.name||'';}}catch(err){alert('JSON 格式错误');}};
r.readAsText(f);
}

function exportCSV(){
let csv='维度,因子,评分,备注\n';
DIMENSIONS.forEach(d=>{data[d.key].forEach((x,i)=>{csv+=`"${d.name}","${d.factors[i].n}",${x.v},"${(x.n||'').replace(/"/g,'""')}"\n`;});});
const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download=`pestel_${Date.now()}.csv`;a.click();URL.revokeObjectURL(url);
}

function openReport(){
const name=document.getElementById('projectName').value||'PESTEL 分析报告';
let text=`${name}\n生成时间: ${new Date().toLocaleString('zh-CN')}\n${'='.repeat(40)}\n\n`;
DIMENSIONS.forEach(d=>{
const arr=data[d.key];const avg=(arr.reduce((s,x)=>s+x.v,0)/arr.length).toFixed(1);
text+=`[${d.icon}] ${d.name} — 平均分: ${avg}\n`;
d.factors.forEach((f,i)=>{text+=`  • ${f.n}: ${arr[i].v}${arr[i].n?' ('+arr[i].n+')':''}\n`;});text+='\n';
});
const total=DIMENSIONS.reduce((s,d)=>s+data[d.key].reduce((a,x)=>a+x.v,0)/data[d.key].length,0)/DIMENSIONS.length;
text+=`综合评分: ${total.toFixed(1)} / 10\n`;
text+=`\n分析结论: ${total>=7?'外部环境整体利好，建议积极扩张。':total>=5?'环境中性，需关注关键风险因子。':'外部环境挑战较大，建议保守防御。'}\n`;
document.getElementById('reportText').value=text;
document.getElementById('reportModal').classList.add('open');
}
function closeModal(){document.getElementById('reportModal').classList.remove('open');}
function copyReport(){navigator.clipboard.writeText(document.getElementById('reportText').value);alert('已复制到剪贴板');}
function downloadReport(){const blob=new Blob([document.getElementById('reportText').value],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`pestel_report_${Date.now()}.txt`;a.click();URL.revokeObjectURL(url);}

document.getElementById('industrySelect').addEventListener('change',function(){
const v=this.value;if(v==='custom'){initData();render();return;}
const p=PRESETS[v];if(!p)return;
DIMENSIONS.forEach(d=>{data[d.key]=p[d.key].map(x=>({v:x,n:''}));});
render();
});

initData();render();
</script>
</body>
